services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jogopawon-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - PORT=8085
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    networks:
      - jogopawon-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jogopawon-frontend
    restart: unless-stopped
    ports:
      - "8086:80"
    depends_on:
      - backend
    networks:
      - jogopawon-net

networks:
  jogopawon-net:
    driver: bridge
