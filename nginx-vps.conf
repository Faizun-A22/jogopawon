# ==============================================================================
# KONFIGURASI NGINX HOST VPS (Reverse Proxy untuk JogoPawon Mart)
# Lokasi file di VPS: /etc/nginx/sites-available/jogopawon.conf
# ==============================================================================

# 1. Server Block HTTP (Port 80): Paksa Redirect ke HTTPS Secara Permanen (301)
server {
    listen 80;
    listen [::]:80;
    server_name jogopawon.my.id www.jogopawon.my.id;

    # Mengalihkan seluruh lalu lintas HTTP biasa ke protokol aman HTTPS
    return 301 https://$host$request_uri;
}

# 2. Server Block HTTPS (Port 443 SSL): Layani Aplikasi dengan Enkripsi Penuh
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jogopawon.my.id www.jogopawon.my.id;

    ssl_certificate /etc/ssl/certs/berdikari.crt;
    ssl_certificate_key /etc/ssl/private/berdikari.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers & HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 25M;

    # Frontend Web & Admin (Port 8086)
    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8086/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket Real-Time
    location /ws {
        proxy_pass http://127.0.0.1:8086/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
