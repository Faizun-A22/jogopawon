# ==============================================================================
# KONFIGURASI NGINX HOST VPS (Reverse Proxy untuk JogoPawon Mart)
# Lokasi file di VPS: /etc/nginx/sites-available/jogopawon.conf
# ==============================================================================

server {
    listen 80;
    listen 443 ssl;
    server_name jogopawon.my.id www.jogopawon.my.id;

    ssl_certificate /etc/ssl/certs/berdikari.crt;
    ssl_certificate_key /etc/ssl/private/berdikari.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    # Frontend Web & Admin (Port 8086)
    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8086/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Real-Time
    location /ws {
        proxy_pass http://127.0.0.1:8086/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
